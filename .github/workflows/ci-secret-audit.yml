          S_REDIS_URL: ${{ secrets.REDIS_URL }}
          S_S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S_MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          S_MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          S_HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          S_HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          S_HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
          S_LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          S_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          S_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
