          S_CI_TRUSTED_USERS: ${{ secrets.CI_TRUSTED_USERS }}
          S_RELEASE_VERSIONS: ${{ secrets.RELEASE_VERSIONS }}
          S_PYX_TEAM: ${{ secrets.PYX_TEAM }}
          S_CI_HTTP_PROXY: ${{ secrets.CI_HTTP_PROXY }}
